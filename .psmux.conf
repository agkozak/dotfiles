# ~/.psmux.conf: psmux settings
#
# https://github.com/agkozak/dotfiles
#
# psmux reads the first of ~/.psmux.conf, ~/.psmuxrc, ~/.tmux.conf and
# ~/.config/psmux/psmux.conf that exists, so with this file present it no
# longer reads ~/.tmux.conf by itself. ~/.tmux.conf is also read by real tmux
# (MSYS2's, for example), which reports an error for options it doesn't
# know, such as psmux's. So the settings that both use stay in ~/.tmux.conf,
# which is sourced here, and the psmux-only settings follow.

source-file ~/.tmux.conf

# Keep PSReadLine's predictions as the PowerShell profile sets them
# (PredictionSource History). psmux starts the shell in each pane with a
# command that dot-sources the PowerShell profiles. With this option off (the
# default), that command then runs Set-PSReadLineOption -PredictionSource
# None, which turns predictions off. With it on, the profile's
# PredictionSource is kept.
set -g allow-predictions on

# Destroy a session when its last client detaches, as ~/.tmux.conf.local
# sets for tmux. ~/.tmux.conf sources that file through
# if-shell "[ -f ~/.tmux.conf.local ]", but under psmux the setting wasn't
# applied (the running server had destroy-unattached off), so it is set here.
set -g destroy-unattached on
